components:
  schemas:
    AuthConfigOut:
      properties:
        oauth_provider:
          title: Oauth Provider
          type: string
        redirect_urls:
          items:
            type: string
          title: Redirect Urls
          type: array
        server_version:
          title: Server Version
          type: string
        supabase_anon_key:
          title: Supabase Anon Key
          type: string
        supabase_url:
          title: Supabase Url
          type: string
      required:
      - supabase_url
      - supabase_anon_key
      - oauth_provider
      - redirect_urls
      - server_version
      title: AuthConfigOut
      type: object
    BatchRequest:
      properties:
        attempt:
          minimum: 1.0
          title: Attempt
          type: integer
        job_id:
          format: uuid
          title: Job Id
          type: string
      required:
      - job_id
      - attempt
      title: BatchRequest
      type: object
    BatchResult:
      properties:
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
        remaining:
          anyOf:
          - type: integer
          - type: 'null'
          title: Remaining
        state:
          enum:
          - running
          - completed
          - failed
          title: State
          type: string
      required:
      - state
      - remaining
      - reason
      title: BatchResult
      type: object
    Candidate:
      properties:
        body_hash:
          title: Body Hash
          type: string
        fused_rank:
          title: Fused Rank
          type: integer
        heading_path:
          items:
            type: string
          title: Heading Path
          type: array
        point_id:
          title: Point Id
          type: string
        product:
          title: Product
          type: string
        rerank_score:
          anyOf:
          - type: number
          - type: 'null'
          title: Rerank Score
        source_url:
          title: Source Url
          type: string
        version:
          title: Version
          type: string
      required:
      - point_id
      - product
      - version
      - source_url
      - heading_path
      - body_hash
      - fused_rank
      - rerank_score
      title: Candidate
      type: object
    DocWindowOut:
      properties:
        heading_path:
          items:
            type: string
          title: Heading Path
          type: array
        ordinals:
          items:
            type: integer
          title: Ordinals
          type: array
        point_id:
          title: Point Id
          type: string
        product:
          title: Product
          type: string
        source_url:
          title: Source Url
          type: string
        text:
          title: Text
          type: string
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
        version:
          title: Version
          type: string
      required:
      - point_id
      - product
      - version
      - source_url
      - heading_path
      - title
      - ordinals
      - text
      title: DocWindowOut
      type: object
    FrontierUrlOut:
      properties:
        attempts:
          title: Attempts
          type: integer
        fetched_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Fetched At
        last_error:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Error
        status:
          title: Status
          type: string
        url:
          title: Url
          type: string
      required:
      - url
      - status
      - attempts
      - last_error
      - fetched_at
      title: FrontierUrlOut
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    HealthResponse:
      properties:
        config_version:
          title: Config Version
          type: string
        status:
          title: Status
          type: string
      required:
      - status
      - config_version
      title: HealthResponse
      type: object
    JobOut:
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        id:
          format: uuid
          title: Id
          type: string
        kind:
          title: Kind
          type: string
        product:
          anyOf:
          - type: string
          - type: 'null'
          title: Product
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
        source_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Source Id
        stalled:
          default: false
          title: Stalled
          type: boolean
        state:
          title: State
          type: string
        updated_at:
          format: date-time
          title: Updated At
          type: string
        url:
          anyOf:
          - type: string
          - type: 'null'
          title: Url
      required:
      - id
      - kind
      - state
      - reason
      - source_id
      - created_at
      - updated_at
      title: JobOut
      type: object
    MeOut:
      properties:
        is_staff:
          title: Is Staff
          type: boolean
        kind:
          title: Kind
          type: string
        quota_per_day:
          title: Quota Per Day
          type: integer
        rerankers:
          items:
            type: string
          title: Rerankers
          type: array
        subject:
          title: Subject
          type: string
      required:
      - kind
      - subject
      - is_staff
      - quota_per_day
      - rerankers
      title: MeOut
      type: object
    PageUploadIn:
      properties:
        html:
          minLength: 1
          title: Html
          type: string
        url:
          title: Url
          type: string
      required:
      - url
      - html
      title: PageUploadIn
      type: object
    PageUploadOut:
      properties:
        bytes:
          title: Bytes
          type: integer
        queued:
          title: Queued
          type: boolean
        url:
          title: Url
          type: string
      required:
      - url
      - bytes
      - queued
      title: PageUploadOut
      type: object
    ProbeConfig:
      properties:
        kind:
          enum:
          - npm
          - pypi
          - github
          - page
          title: Kind
          type: string
        package:
          anyOf:
          - type: string
          - type: 'null'
          title: Package
        pattern:
          anyOf:
          - type: string
          - type: 'null'
          title: Pattern
        prefix:
          anyOf:
          - type: string
          - type: 'null'
          title: Prefix
        repo:
          anyOf:
          - type: string
          - type: 'null'
          title: Repo
        tag_pattern:
          anyOf:
          - type: string
          - type: 'null'
          title: Tag Pattern
        url:
          anyOf:
          - type: string
          - type: 'null'
          title: Url
      required:
      - kind
      title: ProbeConfig
      type: object
    PurgeOut:
      properties:
        frontier_deleted:
          title: Frontier Deleted
          type: integer
        jobs_deleted:
          title: Jobs Deleted
          type: integer
        points_deleted_by:
          enum:
          - product
          - url
          title: Points Deleted By
          type: string
        product:
          title: Product
          type: string
        source_id:
          format: uuid
          title: Source Id
          type: string
      required:
      - source_id
      - product
      - frontier_deleted
      - jobs_deleted
      - points_deleted_by
      title: PurgeOut
      type: object
    RejectIn:
      properties:
        reason:
          title: Reason
          type: string
      required:
      - reason
      title: RejectIn
      type: object
    ReportIn:
      properties:
        note:
          anyOf:
          - type: string
          - type: 'null'
          title: Note
        point_id:
          title: Point Id
          type: string
        verdict:
          enum:
          - helpful
          - incorrect
          - outdated
          title: Verdict
          type: string
      required:
      - point_id
      - verdict
      title: ReportIn
      type: object
    ReportOut:
      properties:
        id:
          format: uuid
          title: Id
          type: string
      required:
      - id
      title: ReportOut
      type: object
    RerankEvalIn:
      properties:
        point_ids:
          items:
            type: string
          maxItems: 100
          minItems: 1
          title: Point Ids
          type: array
        query:
          title: Query
          type: string
      required:
      - query
      - point_ids
      title: RerankEvalIn
      type: object
    RerankEvalOut:
      properties:
        scores:
          items:
            $ref: '#/components/schemas/RerankScore'
          title: Scores
          type: array
      required:
      - scores
      title: RerankEvalOut
      type: object
    RerankScore:
      properties:
        point_id:
          title: Point Id
          type: string
        score:
          title: Score
          type: number
      required:
      - point_id
      - score
      title: RerankScore
      type: object
    SearchRequest:
      properties:
        debug:
          default: false
          title: Debug
          type: boolean
        query:
          maxLength: 2000
          minLength: 1
          title: Query
          type: string
        reranker:
          anyOf:
          - type: string
          - type: 'null'
          title: Reranker
        sources:
          items:
            $ref: '#/components/schemas/SourceSelector'
          maxItems: 5
          minItems: 1
          title: Sources
          type: array
      required:
      - query
      - sources
      title: SearchRequest
      type: object
    SearchResponse:
      properties:
        candidates:
          anyOf:
          - items:
              $ref: '#/components/schemas/Candidate'
            type: array
          - type: 'null'
          title: Candidates
        config_version:
          title: Config Version
          type: string
        latency_ms:
          title: Latency Ms
          type: integer
        reranker:
          title: Reranker
          type: string
        resolved_versions:
          additionalProperties:
            type: string
          title: Resolved Versions
          type: object
        results:
          items:
            $ref: '#/components/schemas/SearchResult'
          title: Results
          type: array
        retrievals_remaining:
          title: Retrievals Remaining
          type: integer
        timings:
          $ref: '#/components/schemas/SearchTimings'
        untrusted_content_notice:
          title: Untrusted Content Notice
          type: string
      required:
      - results
      - resolved_versions
      - candidates
      - untrusted_content_notice
      - config_version
      - latency_ms
      - reranker
      - timings
      - retrievals_remaining
      title: SearchResponse
      type: object
    SearchResult:
      properties:
        heading_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Heading Id
        heading_path:
          items:
            type: string
          title: Heading Path
          type: array
        ordinal:
          title: Ordinal
          type: integer
        point_id:
          title: Point Id
          type: string
        product:
          title: Product
          type: string
        rank:
          title: Rank
          type: integer
        score:
          title: Score
          type: number
        source_url:
          title: Source Url
          type: string
        text:
          title: Text
          type: string
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
        version:
          title: Version
          type: string
      required:
      - rank
      - score
      - point_id
      - product
      - version
      - source_url
      - heading_path
      - heading_id
      - title
      - ordinal
      - text
      title: SearchResult
      type: object
    SearchTimings:
      description: Milliseconds per stage of one search, so a slow answer names its
        cause.
      properties:
        embed_ms:
          title: Embed Ms
          type: integer
        rerank_ms:
          title: Rerank Ms
          type: integer
        retrieve_ms:
          title: Retrieve Ms
          type: integer
        stitch_ms:
          title: Stitch Ms
          type: integer
        total_ms:
          title: Total Ms
          type: integer
      required:
      - embed_ms
      - retrieve_ms
      - rerank_ms
      - stitch_ms
      - total_ms
      title: SearchTimings
      type: object
    SourceCreateIn:
      description: 'A source the worker cannot fetch itself. Pages arrive through

        PUT /v1/staff/sources/{id}/pages, fetched elsewhere.'
      properties:
        exclude_patterns:
          default: []
          items:
            type: string
          title: Exclude Patterns
          type: array
        include_patterns:
          default: []
          items:
            type: string
          title: Include Patterns
          type: array
        probe:
          anyOf:
          - $ref: '#/components/schemas/ProbeConfig'
          - type: 'null'
        product:
          title: Product
          type: string
        url:
          title: Url
          type: string
        version_rule:
          $ref: '#/components/schemas/VersionRule'
        version_scheme:
          anyOf:
          - enum:
            - semver
            - date
            - rolling
            type: string
          - type: 'null'
          title: Version Scheme
      required:
      - url
      - product
      - version_rule
      title: SourceCreateIn
      type: object
    SourceDetailOut:
      properties:
        base_url:
          title: Base Url
          type: string
        content_selector:
          anyOf:
          - type: string
          - type: 'null'
          title: Content Selector
        descoped_urls:
          default: 0
          title: Descoped Urls
          type: integer
        exclude_patterns:
          items:
            type: string
          title: Exclude Patterns
          type: array
        executor:
          default: queue
          enum:
          - worker
          - queue
          title: Executor
          type: string
        frontier:
          additionalProperties:
            type: integer
          title: Frontier
          type: object
        id:
          format: uuid
          title: Id
          type: string
        include_patterns:
          items:
            type: string
          title: Include Patterns
          type: array
        indexed_pages:
          title: Indexed Pages
          type: integer
        job:
          anyOf:
          - $ref: '#/components/schemas/JobOut'
          - type: 'null'
        page_markdown:
          title: Page Markdown
          type: boolean
        product:
          title: Product
          type: string
        rate_delay_seconds:
          default: 0
          title: Rate Delay Seconds
          type: number
        route:
          enum:
          - browser
          - markdown
          - upload
          - zendesk
          title: Route
          type: string
        status:
          title: Status
          type: string
        versions:
          items:
            type: string
          title: Versions
          type: array
      required:
      - id
      - product
      - base_url
      - status
      - page_markdown
      - route
      - include_patterns
      - exclude_patterns
      - versions
      - frontier
      - indexed_pages
      - job
      title: SourceDetailOut
      type: object
    SourceOut:
      properties:
        active_since:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Active Since
        base_url:
          title: Base Url
          type: string
        chunks:
          title: Chunks
          type: integer
        id:
          format: uuid
          title: Id
          type: string
        indexed_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Indexed At
        pages_done:
          title: Pages Done
          type: integer
        pages_indexed:
          title: Pages Indexed
          type: integer
        pages_total:
          title: Pages Total
          type: integer
        product:
          title: Product
          type: string
        route:
          enum:
          - browser
          - markdown
          - upload
          - zendesk
          title: Route
          type: string
        stage:
          enum:
          - waiting_crawl
          - crawling
          - waiting_index
          - indexing
          - indexed
          - failed
          - cancelled
          - empty
          title: Stage
          type: string
        status:
          title: Status
          type: string
        versions:
          items:
            type: string
          title: Versions
          type: array
      required:
      - id
      - product
      - base_url
      - status
      - versions
      - stage
      - pages_done
      - pages_total
      - pages_indexed
      - chunks
      - route
      - indexed_at
      title: SourceOut
      type: object
    SourceScopeIn:
      description: Staff edit of a source; a field left out stays as it is.
      properties:
        content_selector:
          anyOf:
          - type: string
          - type: 'null'
          title: Content Selector
        exclude_patterns:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Exclude Patterns
        executor:
          anyOf:
          - enum:
            - worker
            - queue
            type: string
          - type: 'null'
          title: Executor
        include_patterns:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Include Patterns
        page_markdown:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Page Markdown
        probe:
          anyOf:
          - $ref: '#/components/schemas/ProbeConfig'
          - type: 'null'
        rate_delay_seconds:
          anyOf:
          - maximum: 60.0
            minimum: 0.0
            type: number
          - type: 'null'
          title: Rate Delay Seconds
        status:
          anyOf:
          - enum:
            - active
            - disabled
            type: string
          - type: 'null'
          title: Status
        version_rule:
          anyOf:
          - $ref: '#/components/schemas/VersionRule'
          - type: 'null'
        version_scheme:
          anyOf:
          - enum:
            - semver
            - date
            - rolling
            type: string
          - type: 'null'
          title: Version Scheme
      title: SourceScopeIn
      type: object
    SourceSelector:
      properties:
        product:
          title: Product
          type: string
        version:
          anyOf:
          - type: string
          - type: 'null'
          title: Version
      required:
      - product
      title: SourceSelector
      type: object
    SubmissionIn:
      properties:
        exclude_patterns:
          default: []
          items:
            type: string
          title: Exclude Patterns
          type: array
        include_patterns:
          default: []
          items:
            type: string
          title: Include Patterns
          type: array
        probe:
          anyOf:
          - $ref: '#/components/schemas/ProbeConfig'
          - type: 'null'
        product:
          title: Product
          type: string
        url:
          title: Url
          type: string
        version_rule:
          $ref: '#/components/schemas/VersionRule'
        version_scheme:
          anyOf:
          - enum:
            - semver
            - date
            - rolling
            type: string
          - type: 'null'
          title: Version Scheme
      required:
      - url
      - product
      - version_rule
      title: SubmissionIn
      type: object
    SubmitAccepted:
      properties:
        job_id:
          format: uuid
          title: Job Id
          type: string
      required:
      - job_id
      title: SubmitAccepted
      type: object
    TokenMintIn:
      properties:
        name:
          minLength: 1
          title: Name
          type: string
        quota_per_day:
          minimum: 1.0
          title: Quota Per Day
          type: integer
      required:
      - name
      - quota_per_day
      title: TokenMintIn
      type: object
    TokenMinted:
      properties:
        id:
          format: uuid
          title: Id
          type: string
        name:
          title: Name
          type: string
        quota_per_day:
          title: Quota Per Day
          type: integer
        token:
          title: Token
          type: string
      required:
      - id
      - token
      - name
      - quota_per_day
      title: TokenMinted
      type: object
    UserGrantIn:
      properties:
        name:
          minLength: 1
          title: Name
          type: string
        staff:
          default: false
          title: Staff
          type: boolean
        subject:
          minLength: 1
          title: Subject
          type: string
      required:
      - subject
      - name
      title: UserGrantIn
      type: object
    UserGrantOut:
      properties:
        granted_by:
          title: Granted By
          type: string
        is_staff:
          title: Is Staff
          type: boolean
        name:
          title: Name
          type: string
        status:
          title: Status
          type: string
        subject:
          title: Subject
          type: string
      required:
      - subject
      - name
      - status
      - is_staff
      - granted_by
      title: UserGrantOut
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
    VersionOut:
      properties:
        chunk_count:
          title: Chunk Count
          type: integer
        indexed_at:
          format: date-time
          title: Indexed At
          type: string
        version:
          title: Version
          type: string
      required:
      - version
      - chunk_count
      - indexed_at
      title: VersionOut
      type: object
    VersionRule:
      description: 'How a page''s version is read. `fixed` with no value means the
        release

        probe names each snapshot; `rolling` is one unversioned bucket.'
      properties:
        kind:
          enum:
          - path_segment
          - subdomain
          - fixed
          - rolling
          title: Kind
          type: string
        pattern:
          anyOf:
          - type: string
          - type: 'null'
          title: Pattern
        segment_index:
          anyOf:
          - type: integer
          - type: 'null'
          title: Segment Index
        value:
          anyOf:
          - type: string
          - type: 'null'
          title: Value
      required:
      - kind
      title: VersionRule
      type: object
    VersionsOut:
      properties:
        latest:
          anyOf:
          - type: string
          - type: 'null'
          title: Latest
        product:
          title: Product
          type: string
        versions:
          items:
            $ref: '#/components/schemas/VersionOut'
          title: Versions
          type: array
      required:
      - product
      - latest
      - versions
      title: VersionsOut
      type: object
    WorkerOut:
      properties:
        id:
          title: Id
          type: string
        job_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Job Id
        last_progress_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Last Progress At
        last_seen:
          format: date-time
          title: Last Seen
          type: string
        silent:
          title: Silent
          type: boolean
        started_at:
          format: date-time
          title: Started At
          type: string
        state:
          enum:
          - busy
          - idle
          - stopped
          - silent
          title: State
          type: string
        version:
          title: Version
          type: string
        via:
          default: grimoire
          enum:
          - grimoire
          - queue
          title: Via
          type: string
      required:
      - id
      - version
      - started_at
      - last_seen
      - last_progress_at
      - job_id
      - silent
      - state
      title: WorkerOut
      type: object
  securitySchemes:
    HTTPBearer:
      scheme: bearer
      type: http
info:
  title: Grimoire
  version: 0.1.0
openapi: 3.1.0
paths:
  /healthz:
    get:
      operationId: healthz_healthz_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: Successful Response
      summary: Healthz
  /v1/auth/config:
    get:
      operationId: auth_config_v1_auth_config_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthConfigOut'
          description: Successful Response
      summary: Auth Config
  /v1/doc/{point_id}:
    get:
